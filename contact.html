<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Foodie Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
.contact-page{
    padding:120px 10%;
    text-align:center;
}

.contact-page h1{
    font-size:50px;
    margin-bottom:20px;
}

.contact-container{
    max-width:700px;
    margin:auto;
    background:#f5f5f5;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

.contact-info{
    margin-bottom:30px;
    font-size:18px;
    line-height:2;
}

.contact-form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.contact-form input,
.contact-form textarea{
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.contact-form textarea{
    height:120px;
    resize:none;
}

.contact-form button{
    background:#ff5722;
    color:white;
    border:none;
    padding:15px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.contact-form button:hover{
    background:black;
}

.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 25px;
    background:#ff5722;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}
</style>

</head>
<body>

<section class="contact-page">

<h1>Contact Us</h1>

<div class="contact-container">

<div class="contact-info">
<p>📍 Hyderabad, Telangana</p>
<p>📞 +91 8978959469</p>
<p>📧 foodiehub@gmail.com</p>
</div>

<form class="contact-form">
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea placeholder="Your Message"></textarea>
<button type="submit">Send Message</button>
</form>

<a href="index.html" class="back-btn">
← Back To Home
</a>

</div>

</section>

</body>
</html>
